name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand (Actions tab, or `gh workflow run ci.yml --ref main`): the only way the macOS job runs for now.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces the run in progress; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Warnings fail the build (dependencies' own warnings are capped by cargo and don't count).
  RUSTFLAGS: -D warnings
  LANG: C.UTF-8

jobs:
  # Linux runs as two jobs side by side, so neither waits for the other: the checks, and the tests.
  checks:
    name: Linux (fmt, clippy, release build, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Docs name the same Claude Code and Codex versions as checked-with/
        run: scripts/check-versions.sh
      - name: shellcheck the scripts (the uninstall script must stay POSIX sh)
        # The runner's own shellcheck, which may be older than yours: older ones warn about more.
        run: |
          shellcheck --version | sed -n 2p
          shellcheck scripts/*.sh tests/fake-claude.sh tests/fake-codex-server.sh tests/fake-codex-exec.sh
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo build --release
        run: cargo build --locked --release

  linux:
    name: Linux (test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: Git identity for the tests
        # The tests make repos and commits in temp folders. Set in the global config (not GIT_* variables, which
        # would override the names the tests give git themselves).
        run: |
          git config --global user.name platoon-ci
          git config --global user.email ci@example.invalid
      - name: cargo nextest run
        # All the test binaries at once (`.config/nextest.toml`, profile ci): a failing test's output is printed as
        # it happens and again at the end, and a hung one is named and ended.
        run: cargo nextest run --locked --profile ci
      - name: cargo nextest run (the scale checks, on their own)
        # They time themselves, so nothing else runs beside them. Run even when the step above failed.
        if: success() || failure()
        run: cargo nextest run --locked --profile ci-perf

  msrv:
    name: Minimum Rust (1.88) builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # An older compiler may warn about things newer ones don't: this job checks it builds, not that it is quiet.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88 (Cargo.toml's rust-version)
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo build (every target, tests included)
        run: cargo build --locked --all-targets

  macos:
    name: macOS (test, release build)
    # macOS minutes cost 10x while the repo is private: pushes to main and runs started by hand only. Once the repo is
    # public, drop this line so pull requests run it too.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the runner's short temp folder
        # macOS's own (/var/folders/.../T/) is long, and a Unix socket's path may be at most 104 bytes there: the
        # tests' session hosts put their sockets in temp folders.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - name: cargo build --release
        run: cargo build --locked --release
      - name: Git identity for the tests
        # The tests make repos and commits in temp folders. Set in the global config (not GIT_* variables, which
        # would override the names the tests give git themselves).
        run: |
          git config --global user.name platoon-ci
          git config --global user.email ci@example.invalid
      - name: cargo nextest run
        # As on Linux: every test runs even after one fails, a failing test's output is printed as it happens, and a
        # hung one is named and ended before the job's timeout.
        run: cargo nextest run --locked --profile ci
      - name: cargo nextest run (the scale checks, on their own)
        if: success() || failure()
        run: cargo nextest run --locked --profile ci-perf
