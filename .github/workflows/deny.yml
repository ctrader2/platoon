name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 13:00 UTC: a new advisory against a crate we pin shows up even when nothing is pushed.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deny-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DENY_VERSION: "0.20.2"
  # sha256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz, from the release's .sha256 file.
  DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  deny:
    name: Licenses, advisories, bans, sources (deny.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny (release binary, checked by sha256)
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: cargo deny --locked check
