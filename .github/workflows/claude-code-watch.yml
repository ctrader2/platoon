name: Claude Code watch

# Once a day: is there a Claude Code newer than the one platoon was last checked with (checked-with/claude-code)?
# If so, open one issue asking for it to be checked (never twice for one version). It only reports: it never
# commits, pushes or edits anything. The logic is scripts/claude-code-watch.sh, which runs locally too.

on:
  schedule:
    # 13:00 UTC: 9:00 US Eastern daylight time (8:00 in winter).
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what it would do (create no label or issue)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two runs at once could both open the issue: one at a time.
  group: claude-code-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Compare npm's Claude Code with checked-with/claude-code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check npm and open an issue if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ASSIGNEE: ctrader2
        run: scripts/claude-code-watch.sh
