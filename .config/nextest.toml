# How CI runs the tests, in two passes: `cargo nextest run --profile ci`, then `--profile ci-perf`. Every test
# binary's tests share one pool, instead of `cargo test` running the binaries one after another. Locally `cargo test`
# is the check; both must pass.
[profile.ci]
# All but the scale checks. They mostly wait (on a pty, the stand-in claude, a timer) rather than compute, so more
# run at once than the runner has cores (4 on Linux, 3 on macOS).
default-filter = 'not test(/^perf::/)'
test-threads = 16
fail-fast = false
# Never retried: a test that fails once is a race to fix, not to retry.
retries = 0
# A test still running after a minute is named in the log, and one at three minutes is ended, so a hang says
# which test it is long before the job's timeout.
slow-timeout = { period = "60s", terminate-after = 3 }
failure-output = "immediate-final"

# The scale checks (`perf.rs`) time themselves, so they run on their own, one per core: run beside the pool above,
# the list's start (10s at most) took 13s on the runner.
[profile.ci-perf]
default-filter = 'test(/^perf::/)'
test-threads = "num-cpus"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }
failure-output = "immediate-final"
