[package]
name = "platoon-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal app for running and managing AI coding agent sessions: every conversation in one list, projects with notes, tickets and agent squads"
license = "MIT"
repository = "https://github.com/ctrader2/platoon"
homepage = "https://github.com/ctrader2/platoon"
readme = "README.md"
keywords = ["tui", "terminal", "ai", "agents", "sessions"]
categories = ["command-line-utilities", "development-tools"]

# The package is platoon-tui (crates.io's "platoon" is someone else's); the command is still platoon.
[[bin]]
name = "platoon"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
fuzzy-matcher = "0.3.7"
libc = "0.2.189"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"

[build-dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
