[package]
name = "platoon-tui"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal app for running and managing Claude Code and Codex sessions: every conversation in one list, projects with notes, tasks run by squads"
license = "MIT"
repository = "https://github.com/ctrader2/platoon"
homepage = "https://github.com/ctrader2/platoon"
readme = "README.md"
keywords = ["tui", "claude-code", "codex", "ai", "terminal"]
categories = ["command-line-utilities", "development-tools"]
# What the crate on crates.io leaves out: CI, the release and Nix files, and cargo-about's files for the license list,
# which only the repository uses.
exclude = ["/.github", "/.config", "/flake.nix", "/flake.lock", "/dist-workspace.toml", "/about.toml", "/about.hbs"]

# The package is platoon-tui (crates.io's "platoon" is someone else's); the command is still platoon.
[[bin]]
name = "platoon"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# Only to switch on how crossterm (ratatui's) reads the keyboard: "use-dev-tty" waits with poll(), which keeps reporting
# input that is there. Its default waits with mio, edge-triggered, and drops the keyboard's readiness when a resize
# signal is handled in the same wake-up: a key pressed as the window resized then waits for the next key.
crossterm = { version = "0.29.0", default-features = false, features = ["use-dev-tty"] }
fuzzy-matcher = "0.3.7"
libc = "0.2.189"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Read only: Codex's config.toml (its MCP servers, for idle stop).
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = "0.2.2"
vt100 = "0.18.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Dependencies are optimized in debug and test builds too: the scale checks (`perf.rs`) spend their time in
# serde_json and friends, and run in about half the time. Only a clean build pays for it; platoon's own code still
# builds unoptimized.
[profile.dev.package."*"]
opt-level = 2
